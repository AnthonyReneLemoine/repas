<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#254c3d"><title>Tableau des repas</title>
  <link rel="icon" href="./eat.png"><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="./eat.png" alt=""><span>Tableau<br>des repas</span></div>
    <nav aria-label="Cuisine"><button data-page="planning">Planning</button><button data-page="recettes">Recettes</button><button data-page="courses">Liste de courses</button><button data-page="guide">Guide Air Fryer</button></nav>
    <div class="account"><span id="mode">Essai sur cet appareil</span><button id="account">Connecter Firebase</button></div>
  </aside>
  <main>
    <header><div><p id="dateLabel"></p><h1 id="title">Planning</h1></div><button class="primary" id="newMeal">+ Nouvelle recette</button></header>
    <p id="notice" role="status" aria-live="polite"></p>
    <section data-view="planning">
      <div class="toolbar"><div class="week-switch"><button data-shift="-1" aria-label="Semaine précédente">‹</button><strong id="planningRange"></strong><button data-shift="1" aria-label="Semaine suivante">›</button></div><button data-today>Aujourd’hui</button><button id="smsWeek">Exporter les dîners par SMS</button><button id="printWeek">Imprimer le planning</button></div>
      <div id="board"></div><div class="foot-actions"><button id="reset">Vider la période affichée</button></div>
    </section>
    <section data-view="recettes" hidden>
      <div class="toolbar"><input type="search" id="search" aria-label="Rechercher une recette" placeholder="Rechercher une recette…"><select id="filter" aria-label="Filtrer par appareil"></select><label><input type="checkbox" id="archived"> Inclure les archives</label></div>
      <div id="recipes" class="grid"></div>
    </section>
    <section data-view="courses" hidden>
      <div class="toolbar"><div class="week-switch"><button data-shift="-1" aria-label="Semaine précédente">‹</button><strong class="weekLabel"></strong><button data-shift="1" aria-label="Semaine suivante">›</button></div><label>Convives par repas <select id="shoppingPortions"></select></label></div>
      <div id="shopping" class="paper"></div><div class="foot-actions"><button id="txt">Télécharger en TXT</button><button id="printShop">Imprimer / PDF A4</button></div>
    </section>
    <section data-view="guide" hidden>
      <div class="toolbar"><strong>Moulinex Easy Fry Mega 7,5 L</strong><input id="guideSearch" type="search" aria-label="Rechercher un aliment" placeholder="Rechercher un aliment…"><button id="printGuide">Imprimer / PDF A4</button></div>
      <div id="guide" class="grid"></div>
    </section>
    <footer><button id="export">Sauvegarder en JSON</button><button id="importBtn">Importer une sauvegarde</button><input type="file" id="importFile" accept=".json,application/json" hidden></footer>
  </main>
  <dialog id="dialog"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="close" aria-label="Fermer">×</button></div><div id="dialogBody"></div><p id="dialogError" role="alert"></p></dialog>
  <article id="printArea"></article>
  <script type="module" src="./app.js"></script>
</body></html>
